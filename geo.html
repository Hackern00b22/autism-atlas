<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US Map · ASD EurekaAlert Database</title>
<meta name="theme-color" content="#05060a">
<script>
/* Blocking on purpose: the stylesheet defaults to dark, so setting the saved
   theme after the body paints gives users who chose light a dark flash on every
   load. */
(function () {
  try {
    var t = localStorage.getItem('arn-theme-v1');
    if (!t) t = 'dark';
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'light' ? '#DFE5EE' : '#05060a');
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --line-rgb: 120, 140, 200;
    --panel-rgb: 10, 13, 20;
    --void-rgb: 5, 6, 10;
    --surface-rgb: 17, 21, 31;
    --surface-1: rgba(var(--panel-rgb), 0.88);
    --surface-2: rgba(var(--void-rgb), 0.82);
    --surface-3: rgba(var(--surface-rgb), 0.5);
    --blur: blur(12px);
    --panel-shadow: none;
    --on-accent: #05060a;
    --bg-0: #05060a;
    --bg-1: #0a0d14;
    --bg-2: #11151f;
    --ink-0: #e6ecff;
    --ink-1: #98a4c2;
    --ink-2: #5d6783;
    --grid: rgba(var(--line-rgb), 0.06);
    --line: rgba(var(--line-rgb), 0.12);
    --neon-immuno:   #00f0ff;
    --neon-cyto:     #ff2bd6;
    --neon-behav:    #b6ff3c;
    --neon-neuro:    #ffb020;
    --neon-gen:      #7a5cff;
    --neon-interv:   #ff5757;
    --up: #2dd4bf;
    --down: #e0566b;
    --gold: #ffd97a;
    --accent: var(--neon-behav);
    /* lane hues — the map mixes these into the base surface by count */
    --lane-pubs-rgb:    0, 240, 255;
    --lane-nih-rgb:     122, 92, 255;
    --lane-trials-rgb:  182, 255, 60;
    --lane-patents-rgb: 255, 176, 32;
    --map-base-rgb:     22, 27, 40;
    --map-stroke:       rgba(120, 140, 200, 0.35);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --line-rgb: 46, 62, 90;
    --panel-rgb: 246, 248, 252;
    --void-rgb: 226, 231, 240;
    --surface-rgb: 226, 231, 240;
    --surface-1: #F2F5F9;
    --surface-2: #E8EDF4;
    --surface-3: #E3E9F2;
    --blur: none;
    --panel-shadow: 0 1px 2px rgba(30, 42, 66, 0.06), 0 6px 20px rgba(30, 42, 66, 0.08);
    --on-accent: #FFFFFF;
    --bg-0: #DFE5EE;
    --bg-1: #F2F5F9;
    --bg-2: #D2DAE6;
    --ink-0: #0F1720;
    --ink-1: #414F66;
    --ink-2: #6A778F;
    --grid: rgba(46, 62, 90, 0.10);
    --line: rgba(46, 62, 90, 0.22);
    --neon-immuno:   #00707F;
    --neon-cyto:     #B01B8C;
    --neon-behav:    #446400;
    --neon-neuro:    #875600;
    --neon-gen:      #5340C4;
    --neon-interv:   #AB2C28;
    --up: #0E7A6E;
    --down: #AB2C28;
    --gold: #8A5A00;
    --lane-pubs-rgb:    0, 112, 127;
    --lane-nih-rgb:     83, 64, 196;
    --lane-trials-rgb:  68, 100, 0;
    --lane-patents-rgb: 135, 86, 0;
    --map-base-rgb:     236, 240, 246;
    --map-stroke:       rgba(46, 62, 90, 0.35);
  }
  :root[data-theme="light"] .panel,
  :root[data-theme="light"] .btn,
  :root[data-theme="light"] .tile,
  :root[data-theme="light"] .card { box-shadow: var(--panel-shadow); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: var(--bg-0); color: var(--ink-0);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none; z-index: 0;
  }
  .corner { position: fixed; width: 14px; height: 14px; border: 1px solid var(--ink-2); z-index: 30; pointer-events: none; }
  .corner.tl { top: 16px; left: 16px; border-right: none; border-bottom: none; }
  .corner.tr { top: 16px; right: 16px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 16px; left: 16px; border-right: none; border-top: none; }
  .corner.br { bottom: 16px; right: 16px; border-left: none; border-top: none; }

  .wrap { position: relative; z-index: 2; max-width: 1280px; margin: 0 auto; padding: 22px 32px 80px; }

  .hud { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
  .brand {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12.5px; letter-spacing: 0.28em; color: var(--ink-1); text-transform: uppercase;
  }
  .brand .title {
    display: block; font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: 22px; letter-spacing: -0.01em; color: var(--ink-0);
    text-transform: none; margin-top: 4px; font-weight: 500;
  }
  .brand .title em { font-style: normal; color: var(--accent); }
  .hud .tiles { display: flex; gap: 10px; flex-wrap: wrap; }
  .tile {
    background: var(--surface-1); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--line); border-radius: 4px; padding: 8px 14px; min-width: 96px;
    border-top: 2px solid var(--tile-color, var(--line));
  }
  .tlabel { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-2); }
  .tval { font-size: 19px; font-weight: 500; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .navrow { display: flex; gap: 10px; margin: 18px 0 14px; flex-wrap: wrap; align-items: center; }
  .btn {
    background: var(--surface-1); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--line); color: var(--ink-1); border-radius: 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; padding: 9px 14px; cursor: pointer; text-decoration: none;
    transition: color 0.18s, border-color 0.18s, background-color 0.18s; display: inline-flex; align-items: center; gap: 7px;
  }
  .btn:hover { color: var(--ink-0); border-color: var(--ink-1); }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: var(--accent); color: var(--on-accent); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .spacer { flex: 1; }

  .status { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-2); min-height: 18px; margin: 2px 0 10px; }
  .status.err { color: var(--neon-interv); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  .cols { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface-1); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; margin-bottom: 16px;
  }
  .panel h3 {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--ink-2); font-weight: 400; margin-bottom: 10px;
  }
  .panel .note { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
  .panel .note code { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-1); }

  .frow { display: flex; align-items: center; gap: 9px; padding: 5px 4px; min-height: 24px; cursor: pointer; user-select: none; border-radius: 3px; border: 0; background: transparent; width: 100%; font: inherit; color: inherit; text-align: left; }
  .frow:hover { background: var(--surface-3); }
  .frow .swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .frow.off { opacity: 0.38; }
  .frow.on { background: var(--surface-3); box-shadow: inset 2px 0 0 var(--row-color, var(--accent)); }
  .frow:disabled { opacity: 0.3; cursor: default; }
  .frow .lbl { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frow .n { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .yr { display: grid; grid-template-columns: 34px 1fr 44px; gap: 8px; align-items: center; padding: 4px 4px; min-height: 24px; cursor: pointer; border: 0; background: transparent; width: 100%; font: inherit; color: inherit; border-radius: 3px; }
  .yr:hover { background: var(--surface-3); }
  .yr.on { background: var(--surface-3); box-shadow: inset 2px 0 0 var(--row-color, var(--accent)); }
  .yr .fyl { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-1); font-variant-numeric: tabular-nums; text-align: left; }
  .yr .barwrap { display: block; height: 11px; background: rgba(var(--line-rgb), 0.14); border-radius: 2px; overflow: hidden; }
  .yr .bar { display: block; height: 100%; background: var(--row-color, var(--accent)); opacity: 0.9; border-radius: 2px; }
  .yr .amt { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-1); text-align: right; font-variant-numeric: tabular-nums; }

  .yearsel { display: flex; gap: 8px; align-items: center; }
  .yearsel select {
    flex: 1; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-0);
    border-radius: 4px; padding: 7px 8px; font: inherit; font-size: 13px;
  }
  .yearsel .to { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-2); }

  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .toolbar input[type=search] {
    flex: 1; min-width: 200px; background: var(--surface-2); border: 1px solid var(--line);
    color: var(--ink-0); border-radius: 4px; padding: 9px 12px; font: inherit; font-size: 14px;
  }
  .toolbar input[type=search]:focus { outline: none; border-color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg button {
    background: var(--surface-1); border: none; color: var(--ink-2); cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 9px 13px; transition: color 0.15s, background-color 0.15s;
  }
  .seg button.on { background: var(--accent); color: var(--on-accent); }
  .seg button:not(.on):hover { color: var(--ink-0); }

  .modchips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
  .modchips .lbl {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.22em;
    color: var(--ink-2); text-transform: uppercase; margin-right: 2px;
  }
  .modchip {
    cursor: pointer; font: inherit; font-size: 11.5px; letter-spacing: 0.06em;
    color: var(--ink-1); background: none; white-space: nowrap;
    border: 1px solid rgba(var(--line-rgb), 0.35); border-radius: 999px; padding: 3px 11px;
    transition: color 0.15s, background-color 0.15s, border-color 0.15s;
  }
  .modchip .n { color: var(--ink-2); font-family: 'JetBrains Mono', monospace; font-size: 10.5px; margin-left: 4px; }
  .modchip:hover { color: var(--ink-0); border-color: rgba(var(--line-rgb), 0.6); }
  .modchip.on { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  .modchip.on .n { color: var(--on-accent); }
  .modchip:disabled { opacity: 0.4; cursor: default; }

  /* ---- the map ---- */
  .mappanel { position: relative; padding: 10px 10px 6px; }
  .mappanel svg { width: 100%; height: auto; display: block; }
  .mappanel path.st { stroke: var(--map-stroke); stroke-width: 0.8; cursor: pointer; transition: fill 0.25s; vector-effect: non-scaling-stroke; }
  .mappanel path.st:hover, .mappanel path.st:focus-visible { stroke: var(--ink-0); stroke-width: 1.4; outline: none; }
  .mappanel path.st.sel { stroke: var(--accent); stroke-width: 2.2; }
  .mappanel text.lab { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: var(--ink-1); pointer-events: none; text-anchor: middle; letter-spacing: 0.04em; }
  .mappanel text.lab.dim { fill: var(--ink-2); font-size: 8.5px; }
  .tip {
    position: absolute; pointer-events: none; z-index: 5; display: none;
    background: var(--surface-1); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--line); border-radius: 4px; padding: 9px 12px; min-width: 170px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  }
  .tip .tname { font-size: 14px; font-weight: 500; margin-bottom: 5px; }
  .tip .trow { display: flex; align-items: center; gap: 7px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-1); font-variant-numeric: tabular-nums; }
  .tip .trow .sw { width: 8px; height: 8px; border-radius: 2px; }
  .tip .trow .n { margin-left: auto; color: var(--ink-0); }
  .legend { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 6px 2px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
  .legend .ramp { width: 150px; height: 9px; border-radius: 2px; border: 1px solid var(--line); }
  .legend .sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: -1px; }
  .legend .sel { margin-left: auto; color: var(--accent); cursor: pointer; background: none; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 4px; padding: 2px 8px; font: inherit; letter-spacing: 0.1em; text-transform: uppercase; }
  .legend .sel:hover { background: var(--accent); color: var(--on-accent); }

  .listhead { display: flex; align-items: baseline; gap: 10px; margin: 16px 0 10px; flex-wrap: wrap; }
  .listhead h2 { font-size: 16px; font-weight: 500; }
  .listhead .cnt { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }

  .card {
    background: var(--surface-1); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--line); border-left: 3px solid var(--st-color, var(--line));
    border-radius: 4px; padding: 12px 16px; margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: rgba(var(--line-rgb), 0.3); }
  .card .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .card .stchip {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--st-color, var(--ink-1));
  }
  .card .num, .card .date { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .card .loc { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-1); }
  .card .rtitle { font-size: 15px; font-weight: 500; line-height: 1.35; margin: 6px 0 5px; }
  .card .rtitle a { color: var(--ink-0); text-decoration: none; }
  .card .rtitle a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .card .meta { font-size: 12.5px; color: var(--ink-1); line-height: 1.5; }
  .card .meta .sep { color: var(--ink-2); margin: 0 4px; }
  .card .modtag {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
    color: var(--ink-2); border: 1px solid rgba(var(--line-rgb), 0.3);
    border-radius: 999px; padding: 0 7px; white-space: nowrap; margin-left: 4px;
  }
  .empty { text-align: center; color: var(--ink-2); padding: 40px 20px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; letter-spacing: 0.08em; line-height: 2; }
  .morebar { text-align: center; margin: 6px 0 20px; }
</style>
</head>
<body>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

<div class="wrap">
  <div class="hud">
    <div class="brand">
      TMF MALONE / ASD EUREKA ALERT v5.0
      <span class="title">US <em>Map</em></span>
    </div>
    <div class="tiles">
      <div class="tile" style="--tile-color: rgb(var(--lane-pubs-rgb))"><div class="tlabel">Publications</div><div class="tval" id="m-pubs">—</div></div>
      <div class="tile" style="--tile-color: rgb(var(--lane-nih-rgb))"><div class="tlabel">NIH grants</div><div class="tval" id="m-nih">—</div></div>
      <div class="tile" style="--tile-color: rgb(var(--lane-trials-rgb))"><div class="tlabel">Trials</div><div class="tval" id="m-trials">—</div></div>
      <div class="tile" style="--tile-color: rgb(var(--lane-patents-rgb))"><div class="tlabel">Patents</div><div class="tval" id="m-patents">—</div></div>
      <div class="tile"><div class="tlabel">States</div><div class="tval" id="m-states">—</div></div>
    </div>
  </div>

  <div class="navrow">
    <a class="btn" href="index.html">← Research Network</a>
    <a class="btn" href="authors.html">◈ Authors</a>
    <a class="btn" href="press.html">◍ Press</a>
    <a class="btn" href="nih.html">◎ NIH Funding</a>
    <a class="btn" href="pipeline.html">⚕ Trials &amp; Patents</a>
    <span class="spacer"></span>
    <button class="btn" id="theme-toggle" aria-label="Toggle color theme">◒ Dark</button>
  </div>
  <div class="status" id="global-status"></div>

  <div class="cols">
    <div>
      <div class="panel">
        <h3>// Lane</h3>
        <div id="lanes" role="group" aria-label="Choose which records colour the map"></div>
        <div class="note" style="margin-top:10px" id="lane-note"></div>
      </div>
      <div class="panel">
        <h3>// Top states</h3>
        <div id="topstates"></div>
      </div>
      <div class="panel">
        <h3>// Years</h3>
        <div class="yearsel">
          <select id="y-from" aria-label="From year"></select>
          <span class="to">→</span>
          <select id="y-to" aria-label="To year"></select>
        </div>
        <div id="years" style="margin-top:8px"></div>
      </div>
      <div class="panel">
        <h3>// Coverage</h3>
        <div class="note" id="coverage"></div>
      </div>
    </div>

    <div>
      <div class="toolbar">
        <input type="search" id="q" aria-label="Filter" spellcheck="false" placeholder="Filter — title, city, organization, sponsor, author…" autocomplete="off">
        <div class="seg" id="scaleseg" role="group" aria-label="Colour scale">
          <button data-scale="sqrt" class="on" title="Square-root scale — keeps small states visible next to California and New York">√ scale</button>
          <button data-scale="linear" title="Linear scale">Linear</button>
        </div>
      </div>
      <div class="modchips" id="modchips" role="group" aria-label="Filter by therapeutic modality"></div>

      <div class="panel mappanel">
        <svg id="map" viewBox="0 0 960 600" role="img" aria-label="Choropleth map of the United States"></svg>
        <div class="tip" id="tip"></div>
        <div class="legend" id="legend"></div>
      </div>

      <div class="listhead">
        <h2 id="list-title">Records</h2>
        <span class="cnt" id="list-count"></span>
      </div>
      <div id="list"></div>
      <div class="morebar"><button class="btn" id="more-btn" style="display:none">Show more</button></div>
    </div>
  </div>
</div>

<script>
const THEME_KEY = 'arn-theme-v1';
function applyTheme(mode) {
  document.documentElement.setAttribute('data-theme', mode);
  const b = document.getElementById('theme-toggle');
  if (b) b.textContent = mode === 'light' ? '◓ Light' : '◒ Dark';
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', mode === 'light' ? '#DFE5EE' : '#05060a');
  try { localStorage.setItem(THEME_KEY, mode); } catch (e) {}
}
(function () {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(saved || 'dark');
})();

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US');
const money = n => n >= 1e6 ? '$' + (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? '$' + Math.round(n / 1e3) + 'K' : '$' + n;

// ---------- lanes ----------
// Each lane is one record type with its own hue. "all" colours a state by the
// lane that dominates it and shades by the total.
const LANES = {
  pubs:    { label: 'Publications', one: 'Publication', var: '--lane-pubs-rgb',    glyph: '▣' },
  nih:     { label: 'NIH grants',   one: 'NIH grant',   var: '--lane-nih-rgb',     glyph: '◎' },
  trials:  { label: 'Trials',       one: 'Trial',       var: '--lane-trials-rgb',  glyph: '⚕' },
  patents: { label: 'Patents',      one: 'Patent',      var: '--lane-patents-rgb', glyph: '⚙' },
};
const LANE_ORDER = ['pubs', 'nih', 'trials', 'patents'];
const LANE_KEY = 'geo-lane-v1';
const PAGE_SIZE = 40;
// Small Northeastern states get no inline label — the tooltip names them.
const NO_LABEL = new Set(['CT', 'DE', 'DC', 'MA', 'MD', 'NH', 'NJ', 'RI', 'VT']);

let D = null;            // /api/geo payload
let GEO = null;          // geo-us.json
let PUBLIC = false;
let LANE = 'all';
let SCALE = 'sqrt';
let MOD_ON = new Set();
let SEL = '';            // selected state code
let Y_FROM = null, Y_TO = null;
let SHOWN = PAGE_SIZE;
let YEARS = [];          // all years seen, ascending
try { LANE = localStorage.getItem(LANE_KEY) || 'all'; } catch (e) {}

function cssRGB(name) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v.split(',').map(x => parseFloat(x));
}
function mix(base, hue, t) {
  return `rgb(${base.map((b, i) => Math.round(b + (hue[i] - b) * t)).join(',')})`;
}

function setStatus(msg, cls) {
  const el = $('global-status');
  el.className = 'status' + (cls === 'err' ? ' err' : '');
  el.textContent = msg;
}

async function loadOne(apiPath, staticPath) {
  try {
    const r = await fetch(apiPath);
    if (!r.ok) throw new Error('no api');
    return await r.json();
  } catch (e) {
    const r = await fetch(staticPath, { cache: 'no-store' });
    PUBLIC = true;
    document.body.classList.add('public');
    return await r.json();
  }
}

async function load() {
  const [d, g] = await Promise.all([
    loadOne('/api/geo', 'geo-data.json'),
    fetch('geo-us.json', { cache: 'no-store' }).then(r => r.json()),
  ]);
  D = d; GEO = g;
  for (const k of LANE_ORDER) for (const r of D[k] || []) r._lane = k;
  if (!D.patents.length && LANE === 'patents') LANE = 'all';
  const yrs = new Set();
  for (const k of LANE_ORDER) for (const r of D[k] || []) if (r.year) yrs.add(r.year);
  YEARS = [...yrs].sort((a, b) => a - b);
  Y_FROM = YEARS[0]; Y_TO = YEARS[YEARS.length - 1];
  // deep links: ?state=MA&lane=nih&q=…
  const p = new URLSearchParams(location.search);
  if (p.get('state') && D.states[p.get('state').toUpperCase()]) SEL = p.get('state').toUpperCase();
  if (p.get('lane') && (p.get('lane') === 'all' || LANES[p.get('lane')])) LANE = p.get('lane');
  if (p.get('q')) $('q').value = p.get('q');
  buildMap();
  buildYearSelects();
  render();
}

// ---------- filtering ----------
function yearOK(r) {
  if (Y_FROM === YEARS[0] && Y_TO === YEARS[YEARS.length - 1]) return true;   // full range: keep undated rows
  return r.year != null && r.year >= Y_FROM && r.year <= Y_TO;
}
function textOK(r, q) {
  if (!q) return true;
  return [r.title, r.city, r.org, r.sponsor, r.authors, r.pi, r.journal, r.assignee, r.state, D.states[r.state]]
    .some(v => v && String(v).toLowerCase().includes(q));
}
function modOK(r) {
  return !MOD_ON.size || (r.mods || []).some(m => MOD_ON.has(m));
}
// rows passing every filter except the state selection, per lane
function filtered() {
  const q = ($('q').value || '').trim().toLowerCase();
  const out = {};
  const lanes = LANE === 'all' ? LANE_ORDER : [LANE];
  for (const k of lanes) out[k] = (D[k] || []).filter(r => yearOK(r) && modOK(r) && textOK(r, q));
  return out;
}
// a row's states: trials count once per US site state, everything else once
const rowStates = r => r.states && r.states.length ? r.states : [r.state];

function counts(f) {
  const per = {};            // state -> {lane: n}
  const tot = {};            // state -> total
  for (const k in f) for (const r of f[k]) for (const s of rowStates(r)) {
    per[s] = per[s] || {}; per[s][k] = (per[s][k] || 0) + 1; tot[s] = (tot[s] || 0) + 1;
  }
  return { per, tot };
}

// ---------- map ----------
function buildMap() {
  const svg = $('map');
  const paths = GEO.states.map(s => `<path class="st" id="st-${s.id}" d="${s.d}" data-id="${s.id}" tabindex="0" role="button" aria-label="${esc(s.name)}"></path>`).join('');
  const labels = GEO.states.filter(s => !NO_LABEL.has(s.id)).map(s =>
    `<text class="lab" x="${s.cx}" y="${s.cy + 3.5}">${s.id}</text>`).join('');
  svg.innerHTML = paths + labels;
  svg.querySelectorAll('path.st').forEach(p => {
    p.addEventListener('mousemove', e => showTip(p.dataset.id, e));
    p.addEventListener('mouseleave', hideTip);
    p.addEventListener('focus', e => showTip(p.dataset.id, null));
    p.addEventListener('blur', hideTip);
    p.addEventListener('click', () => selectState(p.dataset.id));
    p.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectState(p.dataset.id); } });
  });
}

function selectState(id) {
  SEL = SEL === id ? '' : id;
  SHOWN = PAGE_SIZE;
  const p = new URLSearchParams(location.search);
  if (SEL) p.set('state', SEL); else p.delete('state');
  history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : ''));
  render();
}

let CUR = null;   // last computed {f, per, tot, max}
function paint() {
  const f = filtered();
  const { per, tot } = counts(f);
  const base = cssRGB('--map-base-rgb');
  const hues = {}; for (const k of LANE_ORDER) hues[k] = cssRGB(LANES[k].var);
  const val = s => LANE === 'all' ? (tot[s] || 0) : ((per[s] || {})[LANE] || 0);
  const max = Math.max(1, ...GEO.states.map(s => val(s.id)));
  CUR = { f, per, tot, max };
  for (const s of GEO.states) {
    const v = val(s.id);
    const t = v ? 0.18 + 0.82 * (SCALE === 'sqrt' ? Math.sqrt(v / max) : v / max) : 0;
    let hue = hues[LANE === 'all' ? dominant(per[s.id]) : LANE];
    const el = $('st-' + s.id);
    el.style.fill = v ? mix(base, hue, t) : mix(base, base, 0);
    el.classList.toggle('sel', SEL === s.id);
    el.setAttribute('aria-label', `${s.name}: ${fmt(v)} ${LANE === 'all' ? 'records' : LANES[LANE].label.toLowerCase()}`);
  }
  // legend
  const hue = LANE === 'all' ? null : hues[LANE];
  const ramp = hue ? `background: linear-gradient(90deg, ${mix(base, hue, 0.18)}, ${mix(base, hue, 1)})` : '';
  $('legend').innerHTML = (LANE === 'all'
    ? LANE_ORDER.filter(k => (D[k] || []).length).map(k => `<span><span class="sw" style="background:rgb(var(${LANES[k].var}))"></span>${LANES[k].label}</span>`).join('')
      + `<span>· shade = total records (${SCALE === 'sqrt' ? '√' : 'linear'})</span>`
    : `<span>${LANES[LANE].label}</span><span class="ramp" style="${ramp}"></span><span>1 → ${fmt(max)} per state</span>`)
    + (SEL ? `<button class="sel" id="clear-sel" type="button">✕ ${esc(D.states[SEL])}</button>` : '');
  const cs = $('clear-sel'); if (cs) cs.onclick = () => selectState(SEL);
}
function dominant(p) {
  if (!p) return 'pubs';
  let best = 'pubs', n = -1;
  for (const k of LANE_ORDER) if ((p[k] || 0) > n) { n = p[k] || 0; best = k; }
  return best;
}

function showTip(id, e) {
  if (!CUR) return;
  const p = CUR.per[id] || {};
  const rows = LANE_ORDER.filter(k => (D[k] || []).length).map(k =>
    `<div class="trow"><span class="sw" style="background:rgb(var(${LANES[k].var}))"></span>${LANES[k].label}<span class="n">${fmt(p[k] || 0)}</span></div>`).join('');
  const tip = $('tip');
  tip.innerHTML = `<div class="tname">${esc(D.states[id] || id)}</div>${rows}` +
    `<div class="trow" style="margin-top:4px;color:var(--ink-2)">click to list${SEL === id ? ' · selected' : ''}</div>`;
  tip.style.display = 'block';
  const panel = tip.parentElement.getBoundingClientRect();
  if (e) {
    let x = e.clientX - panel.left + 14, y = e.clientY - panel.top + 14;
    if (x + tip.offsetWidth > panel.width - 10) x = e.clientX - panel.left - tip.offsetWidth - 14;
    if (y + tip.offsetHeight > panel.height - 10) y = e.clientY - panel.top - tip.offsetHeight - 14;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  } else {
    tip.style.left = '14px'; tip.style.top = '14px';
  }
}
function hideTip() { $('tip').style.display = 'none'; }

// ---------- side panels ----------
function renderLanes() {
  const all = { label: 'All lanes', var: null };
  const items = [['all', all], ...LANE_ORDER.map(k => [k, LANES[k]])];
  $('lanes').innerHTML = items.map(([k, l]) => {
    const n = k === 'all' ? LANE_ORDER.reduce((a, x) => a + (D[x] || []).length, 0) : (D[k] || []).length;
    const dis = k !== 'all' && !n;
    const sw = k === 'all' ? 'linear-gradient(90deg, rgb(var(--lane-pubs-rgb)), rgb(var(--lane-nih-rgb)), rgb(var(--lane-trials-rgb)), rgb(var(--lane-patents-rgb)))' : `rgb(var(${l.var}))`;
    return `<button type="button" class="frow ${LANE === k ? 'on' : ''}" data-lane="${k}" ${dis ? 'disabled' : ''}
      style="--row-color:${k === 'all' ? 'var(--accent)' : `rgb(var(${l.var}))`}" aria-pressed="${LANE === k}">
      <span class="swatch" style="background:${sw}"></span>
      <span class="lbl">${esc(l.label)}</span><span class="n">${dis ? '—' : fmt(n)}</span></button>`;
  }).join('');
  document.querySelectorAll('[data-lane]').forEach(el => el.onclick = () => {
    LANE = el.dataset.lane;
    try { localStorage.setItem(LANE_KEY, LANE); } catch (e) {}
    SHOWN = PAGE_SIZE;
    render();
  });
  const c = D.coverage;
  $('lane-note').innerHTML = LANE === 'pubs'
    ? `Where the <b>first author</b> works, parsed from the PubMed affiliation (last author when the first has none). ${fmt(c.pubsLocated)} of ${fmt(c.pubsTotal)} library articles resolve to a US state; the rest are outside the US or carry no affiliation.`
    : LANE === 'nih'
    ? `The awardee organization's state, from NIH RePORTER — the ${fmt(c.nihLocated)} browsable projects of the three latest fiscal years.`
    : LANE === 'trials'
    ? `US study sites from ClinicalTrials.gov. A multi-site trial counts once in <em>each</em> state it recruits in, so state totals exceed the ${fmt(c.trialsLocated)} located studies.`
    : LANE === 'patents'
    ? (D.patentsNeedKey ? `Dormant — the patent lane needs EPO Open Patent Services credentials (see Trials &amp; Patents).` : `Assignee state for US patents and applications.`)
    : `Every lane together. Each state takes the hue of the lane that dominates it and is shaded by its total. Hover for the breakdown; click a state to list its records.`;
}

function renderTop() {
  if (!CUR) return;
  const val = s => LANE === 'all' ? (CUR.tot[s] || 0) : ((CUR.per[s] || {})[LANE] || 0);
  const ranked = GEO.states.map(s => [s, val(s.id)]).filter(x => x[1]).sort((a, b) => b[1] - a[1]).slice(0, 12);
  const max = ranked.length ? ranked[0][1] : 1;
  const color = LANE === 'all' ? 'var(--accent)' : `rgb(var(${LANES[LANE].var}))`;
  $('topstates').innerHTML = ranked.map(([s, n]) => `
    <button type="button" class="yr ${SEL === s.id ? 'on' : ''}" data-st="${s.id}" style="--row-color:${color}" aria-pressed="${SEL === s.id}" title="${esc(s.name)}">
      <span class="fyl">${s.id}</span>
      <span class="barwrap"><span class="bar" style="width:${Math.round(n / max * 100)}%"></span></span>
      <span class="amt">${fmt(n)}</span></button>`).join('') || '<div class="note">Nothing matches the current filters.</div>';
  document.querySelectorAll('[data-st]').forEach(el => el.onclick = () => selectState(el.dataset.st));
  $('m-states').textContent = GEO.states.filter(s => val(s.id)).length || '—';
}

function buildYearSelects() {
  const opts = YEARS.map(y => `<option value="${y}">${y}</option>`).join('');
  $('y-from').innerHTML = opts; $('y-to').innerHTML = opts;
  $('y-from').value = Y_FROM; $('y-to').value = Y_TO;
  $('y-from').onchange = () => { Y_FROM = +$('y-from').value; if (Y_TO < Y_FROM) { Y_TO = Y_FROM; $('y-to').value = Y_TO; } SHOWN = PAGE_SIZE; render(); };
  $('y-to').onchange = () => { Y_TO = +$('y-to').value; if (Y_FROM > Y_TO) { Y_FROM = Y_TO; $('y-from').value = Y_FROM; } SHOWN = PAGE_SIZE; render(); };
}

function renderYears() {
  if (!CUR) return;
  // year histogram for the current lane + filters, selected state if any
  const c = {};
  for (const k in CUR.f) for (const r of CUR.f[k]) {
    if (SEL && !rowStates(r).includes(SEL)) continue;
    if (r.year) c[r.year] = (c[r.year] || 0) + 1;
  }
  const ys = Object.keys(c).map(Number).sort((a, b) => b - a).slice(0, 10);
  const max = Math.max(1, ...ys.map(y => c[y]));
  const color = LANE === 'all' ? 'var(--accent)' : `rgb(var(${LANES[LANE].var}))`;
  $('years').innerHTML = ys.map(y => `
    <div class="yr" style="--row-color:${color};cursor:default"><span class="fyl">${y}</span>
      <span class="barwrap"><span class="bar" style="width:${Math.round(c[y] / max * 100)}%"></span></span>
      <span class="amt">${fmt(c[y])}</span></div>`).join('');
}

function renderMods() {
  const labels = D.modalities || {};
  const f = filtered();
  const cnt = {};
  for (const k in f) for (const r of f[k]) {
    if (SEL && !rowStates(r).includes(SEL)) continue;
    (r.mods || []).forEach(m => cnt[m] = (cnt[m] || 0) + 1);
  }
  $('modchips').innerHTML = '<span class="lbl">Modality</span>' +
    Object.entries(labels).map(([k, lbl]) => `
      <button type="button" class="modchip ${MOD_ON.has(k) ? 'on' : ''}" data-mod="${esc(k)}"
        aria-pressed="${MOD_ON.has(k)}" ${cnt[k] || MOD_ON.has(k) ? '' : 'disabled'}
        title="${esc(lbl)} — ${cnt[k] || 0} in view">${esc(lbl)}<span class="n">${cnt[k] || 0}</span></button>`).join('');
  document.querySelectorAll('.modchip').forEach(el => el.onclick = () => {
    const k = el.dataset.mod;
    if (MOD_ON.has(k)) MOD_ON.delete(k); else MOD_ON.add(k);
    SHOWN = PAGE_SIZE;
    render();
  });
}

function renderCoverage() {
  const c = D.coverage;
  const line = (lane, loc, tot) => `<div style="display:flex;gap:8px;align-items:center;margin:3px 0"><span class="swatch" style="width:9px;height:9px;border-radius:2px;background:rgb(var(${LANES[lane].var}))"></span>${LANES[lane].label}<span style="margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px">${fmt(loc)} / ${fmt(tot)}</span></div>`;
  $('coverage').innerHTML = line('pubs', c.pubsLocated, c.pubsTotal) + line('nih', c.nihLocated, c.nihTotal)
    + line('trials', c.trialsLocated, c.trialsTotal) + line('patents', c.patentsLocated, c.patentsTotal)
    + `<div style="margin-top:8px">Located / total. Records with no US location are not on the map${c.pubsUnparsed ? `; ${fmt(c.pubsUnparsed)} articles still await affiliation parsing (weekly job)` : ''}.</div>`;
}

// ---------- record list ----------
function card(r) {
  const L = LANES[r._lane];
  const color = `rgb(var(${L.var}))`;
  const where = [r.city, r.state].filter(Boolean).join(', ');
  let meta = '';
  if (r._lane === 'pubs') meta = `${esc(r.authors)}${r.journal ? `<span class="sep">·</span>${esc(r.journal)}` : ''}${r.branch ? `<span class="sep">·</span>${esc(r.branch)}` : ''}`;
  else if (r._lane === 'nih') meta = `${esc(r.org)}${r.pi ? `<span class="sep">·</span>PI ${esc(r.pi)}` : ''}${r.ic ? `<span class="sep">·</span>${esc(r.ic)}` : ''}${r.award ? `<span class="sep">·</span>${money(r.award)}` : ''}`;
  else if (r._lane === 'trials') meta = `${esc(r.sponsor)}${r.status ? `<span class="sep">·</span>${esc(r.status.replace(/_/g, ' ').toLowerCase())}` : ''}${r.states && r.states.length > 1 ? `<span class="sep">·</span>${r.states.length} states` : ''}${r.enroll ? `<span class="sep">·</span>n=${fmt(r.enroll)}` : ''}`;
  else meta = esc(r.assignee || '');
  return `<div class="card" style="--st-color:${color}">
    <div class="head">
      <span class="stchip">${L.glyph} ${esc(L.one)}</span>
      <span class="date">${r.year || ''}</span>
      <span class="loc">${esc(where)}</span>
    </div>
    <div class="rtitle"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></div>
    <div class="meta">${meta}${(r.mods || []).map(m => `<span class="modtag">${esc((D.modalities || {})[m] || m)}</span>`).join('')}</div>
  </div>`;
}

function renderList() {
  if (!CUR) return;
  let view = [];
  for (const k in CUR.f) for (const r of CUR.f[k]) if (!SEL || rowStates(r).includes(SEL)) view.push(r);
  view.sort((a, b) => (b.year || 0) - (a.year || 0) || LANE_ORDER.indexOf(a._lane) - LANE_ORDER.indexOf(b._lane));
  $('list-title').textContent = (SEL ? D.states[SEL] : 'All states') + (LANE === 'all' ? '' : ' · ' + LANES[LANE].label);
  $('list-count').textContent = `${fmt(view.length)} record${view.length === 1 ? '' : 's'}`;
  if (!view.length) {
    $('list').innerHTML = `<div class="empty">// NOTHING MATCHES${SEL ? ' IN ' + esc(D.states[SEL]).toUpperCase() : ''}</div>`;
    $('more-btn').style.display = 'none';
    return;
  }
  $('list').innerHTML = view.slice(0, SHOWN).map(card).join('');
  $('more-btn').style.display = view.length > SHOWN ? '' : 'none';
  $('more-btn').textContent = `Show more (${fmt(view.length - SHOWN)} remaining)`;
}

function render() {
  $('m-pubs').textContent = fmt(D.pubs.length) || '—';
  $('m-nih').textContent = fmt(D.nih.length) || '—';
  $('m-trials').textContent = fmt(D.trials.length) || '—';
  $('m-patents').textContent = D.patentsNeedKey ? '—' : fmt(D.patents.length);
  renderLanes();
  paint();
  renderTop();
  renderYears();
  renderMods();
  renderCoverage();
  renderList();
}

// ---------- wiring ----------
$('q').addEventListener('input', () => { SHOWN = PAGE_SIZE; render(); });
document.querySelectorAll('#scaleseg button').forEach(b => b.onclick = () => {
  SCALE = b.dataset.scale;
  document.querySelectorAll('#scaleseg button').forEach(x => x.classList.toggle('on', x === b));
  paint();
});
$('more-btn').onclick = () => { SHOWN += PAGE_SIZE; renderList(); };
$('theme-toggle').onclick = () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  if (D) paint();
};

load().catch(e => setStatus(`Could not load map data — ${e.message}`, 'err'));
</script>
</body>
</html>
